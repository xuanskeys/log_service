server:
  port: 8091
spring:
  application:
    name: log-service
  rabbitmq:
    listener:
      simple:
        # A failed log record is rejected once instead of being redelivered forever.
        default-requeue-rejected: false
  cloud:
    nacos:
      config:
        username: xueyuan
        password: 123456
        server-addr: 127.0.0.1:8848
        namespace: xueyuan
        group: DEFAULT_GROUP
        file-extension: yaml, properties
      discovery:
        username: xueyuan
        password: 123456
        server-addr: 127.0.0.1:8848
        namespace: xueyuan
        group: DEFAULT_GROUP
  config:
    import:
      - optional:nacos:${spring.application.name}.yml

operation-log:
  # This application consumes logs; it must not publish logs for itself.
  enabled: false
  consumer:
    services:
      - user-service
      - role-service
    durable: true
